<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 Amalan Cilik Terpuji 🌟</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; color: #1E293B; }
        .kid-font { font-family: 'Comic Neue', cursive; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24">

    <!-- Header / Navbar -->
    <header class="bg-gradient-to-r from-amber-400 via-orange-400 to-pink-500 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-3xl">🌟</span>
                <div>
                    <h1 class="kid-font text-xl sm:text-2xl font-bold tracking-wide">AMALAN CILIK TERPUJI</h1>
                    <p class="text-[10px] sm:text-xs text-amber-100 italic">“Kenali Amalan Positif, Hargai Setiap Usaha”</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span id="currentRoleBadge" class="bg-white/20 text-xs px-3 py-1 rounded-full font-medium">Guru / PPM</span>
                <button onclick="switchRole()" class="text-xs bg-white text-orange-600 px-3 py-1.5 rounded-lg font-bold shadow hover:bg-orange-50 transition cursor-pointer">Tukar Peranan</button>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Container -->
    <main class="max-w-4xl mx-auto p-4 mb-16" id="mainContainer">
        <!-- Loading State -->
        <div class="text-center py-20">
            <div class="inline-block animate-spin text-4xl mb-2">⏳</div>
            <p class="text-xs text-slate-500">Memuatkan data awan dari Google Sheets...</p>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg z-40">
        <div class="max-w-4xl mx-auto flex justify-around py-2">
            <button onclick="changeTab('utama')" id="nav-utama" class="flex flex-col items-center text-orange-500 text-xs font-semibold cursor-pointer">
                <span class="text-xl">🏠</span> Utama
            </button>
            <button onclick="changeTab('rekod')" id="nav-rekod" class="flex flex-col items-center text-slate-400 text-xs font-medium cursor-pointer">
                <span class="text-xl">➕</span> Rekod
            </button>
            <button onclick="changeTab('badge')" id="nav-badge" class="flex flex-col items-center text-slate-400 text-xs font-medium cursor-pointer">
                <span class="text-xl">🏅</span> Podium
            </button>
            <button onclick="changeTab('murid')" id="nav-murid" class="flex flex-col items-center text-slate-400 text-xs font-medium cursor-pointer">
                <span class="text-xl">👧</span> Murid
            </button>
            <button onclick="changeTab('laporan')" id="nav-laporan" class="flex flex-col items-center text-slate-400 text-xs font-medium cursor-pointer">
                <span class="text-xl">📊</span> Laporan
            </button>
        </div>
    </nav>

    <!-- Modal Tambah Murid -->
    <div id="addStudentModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl border border-slate-100 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="kid-font text-xl font-bold text-orange-600">✨ Tambah Murid Baharu</h3>
                <button onclick="closeAddStudentModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg cursor-pointer">✕</button>
            </div>
            
            <form onsubmit="handleAddNewStudent(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Penuh Murid (Huruf Besar)</label>
                    <input type="text" id="newStudentName" required placeholder="Cth: AHMAD DANISH BIN ALI" class="w-full p-3 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:ring-2 focus:ring-orange-400 outline-none uppercase font-medium">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Kelas</label>
                    <select id="newStudentClass" class="w-full p-3 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:ring-2 focus:ring-orange-400 outline-none font-medium">
                        <option value="PRASEKOLAH STS">PRASEKOLAH STS</option>
                    </select>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeAddStudentModal()" class="flex-1 py-3 bg-slate-100 text-slate-600 font-bold text-xs rounded-xl hover:bg-slate-200 transition cursor-pointer">Batal</button>
                    <button type="submit" class="flex-1 py-3 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold text-xs rounded-xl shadow hover:opacity-90 transition cursor-pointer">💾 Simpan Murid</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Skrip Aplikasi Utama -->
    <script>
        let selectedPodiumMonth = 'all';

        function changePodiumMonth(monthVal) {
            selectedPodiumMonth = monthVal;
            renderView();
        }

        // 1. PASTE YOUR WEB APP URL HERE INSIDE THE QUOTES
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzuaBCeogmJKLasd4veucET3UFT69BxaPEYu702huNXPNk9bD-fQGejqDJd0jaBVcSz/exec';

        // 2. CHANGE YOUR 25 STUDENTS HERE
        const defaultStudents = [
            { id: 1, name: "AGILAN A/L NAGALINGAM", class: "PRASEKOLAH STS" },
            { id: 2, name: "BHEEVAN A/L DINENDRAN", class: "PRASEKOLAH STS" },
            { id: 3, name: "DARSHINDRAN A/L THANGAVELU", class: "PRASEKOLAH STS" },
            { id: 4, name: "ISSHWAR PILLAI A/L TENESHWARAN", class: "PRASEKOLAH STS" },
            { id: 5, name: "LAKSHEN A/L LOGARAJAH", class: "PRASEKOLAH STS" },
            { id: 6, name: "NIROSHMAN NAIR A/L SIVASANGAR", class: "PRASEKOLAH STS" },
            { id: 7, name: "PRANAV A/L SHANNMUGAAM", class: "PRASEKOLAH STS" },
            { id: 8, name: "SAILESHVARREN A/L GANESAN", class: "PRASEKOLAH STS" },
            { id: 9, name: "SAKKTHIVEL A/L PRAKASH", class: "PRASEKOLAH STS" },
            { id: 10, name: "SAVEERJAYSH SASITHARAN", class: "PRASEKOLAH STS" },
            { id: 11, name: "SHARANPRAKASH ANANDPRAKASH", class: "PRASEKOLAH STS" },
            { id: 12, name: "TARISH NAIR A/L SARAVANAN", class: "PRASEKOLAH STS" },
            { id: 13, name: "THILEP EZRA A/L THIAGARAJAN", class: "PRASEKOLAH STS" },
            { id: 14, name: "YOVIIN PAUL A/L RAYMOND PAUL", class: "PRASEKOLAH STS" },
            { id: 15, name: "HIMMAIYAZH A/P ELVIS SRI RUSH", class: "PRASEKOLAH STS" },
            { id: 16, name: "KEERTIKA SHREE A/P TIRUKUMEREN", class: "PRASEKOLAH STS" },
            { id: 17, name: "KESHNI A/P KODIESWARA", class: "PRASEKOLAH STS" },
            { id: 18, name: "MANISHKA SRI A/P RAMACHANDAN", class: "PRASEKOLAH STS" },
            { id: 19, name: "MIRTIESHAH BINTI ABDULLAH", class: "PRASEKOLAH STS" },
            { id: 20, name: "NIRRANJANA RAAMKUMAR", class: "PRASEKOLAH STS" },
            { id: 21, name: "NITHYA SRI", class: "PRASEKOLAH STS" },
            { id: 22, name: "RACHEAL A/P MURUGAN", class: "PRASEKOLAH STS" },
            { id: 23, name: "RESSHIKAA NAIIDU A/P JAYWIN", class: "PRASEKOLAH STS" },
            { id: 24, name: "SRISHA A/P SURESH KUMAAR", class: "PRASEKOLAH STS" },
            { id: 25, name: "TAVANAGASHREE A/P ESWARAN", class: "PRASEKOLAH STS" }
        ];

        let students = JSON.parse(localStorage.getItem('sts_students')) || defaultStudents;
        let records = [];
        let currentTab = 'utama';
        let userRole = 'Guru / PPM';
        let selectedStudentProfile = null;

        async function fetchCloudData() {
            if (APPS_SCRIPT_URL === 'https://script.google.com/macros/s/AKfycbzuaBCeogmJKLasd4veucET3UFT69BxaPEYu702huNXPNk9bD-fQGejqDJd0jaBVcSz/exec') {
                records = JSON.parse(localStorage.getItem('sts_records')) || [];
                renderView();
                return;
            }
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                records = data;
                renderView();
            } catch (error) {
                console.error("Gagal ambil data cloud:", error);
                records = JSON.parse(localStorage.getItem('sts_records')) || [];
                renderView();
            }
        }

        function switchRole() {
            userRole = userRole === 'Guru / PPM' ? 'Admin' : 'Guru / PPM';
            document.getElementById('currentRoleBadge').innerText = userRole;
            alert(`Peranan ditukar kepada: ${userRole}`);
            renderView();
        }

        function changeTab(tab) {
            currentTab = tab;
            selectedStudentProfile = null;
            document.querySelectorAll('nav button').forEach(btn => {
                btn.className = "flex flex-col items-center text-slate-400 text-xs font-medium cursor-pointer";
            });
            const navBtn = document.getElementById(`nav-${tab}`);
            if(navBtn) navBtn.className = "flex flex-col items-center text-orange-500 text-xs font-semibold cursor-pointer";
            renderView();
        }

        function renderView() {
            const container = document.getElementById('mainContainer');
            if (selectedStudentProfile !== null) {
                container.innerHTML = renderStudentProfileView(selectedStudentProfile);
                return;
            }

            if (currentTab === 'utama') {
                container.innerHTML = renderDashboard();
            } else if (currentTab === 'rekod') {
                container.innerHTML = renderRecordForm();
            } else if (currentTab === 'badge') {
                container.innerHTML = renderPodiumMonthly();
            } else if (currentTab === 'murid') {
                container.innerHTML = renderStudentList();
            } else if (currentTab === 'laporan') {
                container.innerHTML = renderReport();
            }
        }

        function renderDashboard() {
            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-amber-400 via-orange-400 to-pink-500 rounded-3xl p-6 text-white shadow-md relative overflow-hidden">
                        <div class="relative z-10">
                            <span class="bg-white/20 text-xs px-3 py-1 rounded-full font-semibold">SESI 2026 / 2027 (Multi-User Cloud)</span>
                            <h2 class="kid-font text-3xl font-bold mt-2">Selamat Datang, Cikgu! 🌟</h2>
                            <p class="text-xs text-amber-100 mt-1">Data dikongsi secara langsung dan selamat merentasi semua peranti guru.</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center">
                            <span class="text-2xl">👧👦</span>
                            <p class="text-xs text-slate-500 font-medium mt-1">Jumlah Murid</p>
                            <p class="text-2xl font-bold text-orange-600 mt-0.5">${students.length}</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center">
                            <span class="text-2xl">📝</span>
                            <p class="text-xs text-slate-500 font-medium mt-1">Rekod Bulan Ini</p>
                            <p class="text-2xl font-bold text-blue-600 mt-0.5">${records.length}</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center">
                            <span class="text-2xl">🏅</span>
                            <p class="text-xs text-slate-500 font-medium mt-1">Badge Diberikan</p>
                            <p class="text-2xl font-bold text-emerald-600 mt-0.5">${records.length > 0 ? 'Aktif' : '0'}</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center">
                            <span class="text-2xl">❤️</span>
                            <p class="text-xs text-slate-500 font-medium mt-1">Murid Diraikan</p>
                            <p class="text-2xl font-bold text-purple-600 mt-0.5">${students.length}</p>
                        </div>
                    </div>

                    <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-orange-200 rounded-3xl p-5 shadow-sm">
                        <h3 class="kid-font text-lg font-bold text-orange-800 flex items-center gap-2 mb-3">
                            <span>🌟</span> AMALAN HARI INI
                        </h3>
                        <div class="grid sm:grid-cols-3 gap-3 text-xs">
                            <div class="bg-white/90 p-3.5 rounded-2xl border border-orange-100 shadow-sm">
                                <span class="font-bold text-orange-700 block mb-0.5">🤝 Sahabat Baik</span>
                                <p class="text-slate-600">Bantu seorang rakan hari ini tanpa diminta.</p>
                            </div>
                            <div class="bg-white/90 p-3.5 rounded-2xl border border-orange-100 shadow-sm">
                                <span class="font-bold text-orange-700 block mb-0.5">🙏 Bahasa Sopan</span>
                                <p class="text-slate-600">Jangan lupa ucap terima kasih dan senyum.</p>
                            </div>
                            <div class="bg-white/90 p-3.5 rounded-2xl border border-orange-100 shadow-sm">
                                <span class="font-bold text-orange-700 block mb-0.5">🧹 Kebersihan & Kelas</span>
                                <p class="text-slate-600">Pastikan meja bersih selepas aktiviti.</p>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-slate-700 text-base">5 Kategori Amalan Positif Utama</h3>
                            <button onclick="changeTab('rekod')" class="text-xs text-orange-600 font-semibold cursor-pointer hover:underline">+ Rekod Baru</button>
                        </div>
                        <div class="grid sm:grid-cols-2 gap-3">
                            ${categories.map(cat => `
                                <div class="bg-white p-4 rounded-2xl border ${cat.color} flex items-start space-x-3 shadow-sm">
                                    <span class="text-3xl p-2.5 bg-white rounded-2xl shadow-inner">${cat.icon}</span>
                                    <div>
                                        <h4 class="font-bold text-slate-800 text-sm">${cat.name}</h4>
                                        <p class="text-xs text-slate-500 mt-0.5">${cat.desc}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        const categories = [
            { id: 1, name: "Sahabat Baik", icon: "🤝", color: "bg-blue-50 text-blue-700 border-blue-200", desc: "Membantu rakan, berkongsi, menunggu giliran.", actions: ["Membantu rakan", "Berkongsi", "Menolong tanpa diminta", "Menunggu giliran", "Bekerjasama"] },
            { id: 2, name: "Bahasa Sopan", icon: "🙏", color: "bg-emerald-50 text-emerald-700 border-emerald-200", desc: "Memberi salam, ucap terima kasih/maaf.", actions: ["Memberi salam", "Mengucapkan terima kasih", "Mengucapkan maaf", "Meminta dengan sopan", "Bercakap dengan baik"] },
            { id: 3, name: "Penjaga Kebersihan & Kelas", icon: "🧹", color: "bg-purple-50 text-purple-700 border-purple-200", desc: "Menjaga kebersihan meja, mengemas bahan.", actions: ["Membersihkan tempat selepas aktiviti", "Menjaga kebersihan meja dan kelas", "Membantu mengemas dan menyusun bahan", "Menjaga kemudahan kelas"] },
            { id: 4, name: "Murid Prihatin", icon: "🌱", color: "bg-amber-50 text-amber-700 border-amber-200", desc: "Menjaga tanaman, menjimatkan air.", actions: ["Menjaga tanaman", "Menjimatkan air", "Menutup paip selepas digunakan", "Menjaga persekitaran"] },
            { id: 5, name: "Bintang Usaha", icon: "⭐", color: "bg-rose-50 text-rose-700 border-rose-200", desc: "Menyiapkan tugasan, mencuba perkara baharu.", actions: ["Menyiapkan tugasan", "Mencuba walaupun menghadapi kesukaran", "Berani mencuba perkara baharu", "Mengikuti arahan", "Menunjukkan peningkatan diri"] }
        ];

        function renderRecordForm() {
            return `
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 max-w-lg mx-auto">
                    <h2 class="kid-font text-xl font-bold text-orange-600 mb-4 flex items-center gap-2">
                        <span>➕</span> REKOD AMALAN POSITIF
                    </h2>
                    <form onsubmit="handleSaveRecord(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Kelas</label>
                            <select class="w-full p-3 rounded-xl border border-slate-200 text-sm bg-slate-50 outline-none">
                                <option>PRASEKOLAH STS</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Murid</label>
                            <select id="recStudent" class="w-full p-3 rounded-xl border border-slate-200 text-sm bg-slate-50 outline-none">
                                ${students.map(s => `<option value="${s.name}">${s.name}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Kategori</label>
                            <select id="recCategory" onchange="updateActions()" class="w-full p-3 rounded-xl border border-slate-200 text-sm bg-slate-50 outline-none">
                                ${categories.map(c => `<option value="${c.name}">${c.icon}${c.name}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Amalan Positif</label>
                            <select id="recAction" class="w-full p-3 rounded-xl border border-slate-200 text-sm bg-slate-50 outline-none">
                                ${categories[0].actions.map(a => `<option value="${a}">${a}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Catatan (Pilihan)</label>
                            <input type="text" id="recNote" placeholder="Cth: Membantu mengemas mainan..." class="w-full p-3 rounded-xl border border-slate-200 text-sm bg-slate-50 outline-none">
                        </div>
                        <button type="submit" id="saveBtn" class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-xl shadow hover:opacity-90 transition cursor-pointer">
                            💾 SIMPAN REKOD
                        </button>
                    </form>
                </div>
            `;
        }

        function updateActions() {
            const catName = document.getElementById('recCategory').value;
            const cat = categories.find(c => c.name == catName);
            const actionSelect = document.getElementById('recAction');
            if(cat && actionSelect) {
                actionSelect.innerHTML = cat.actions.map(a => `<option value="${a}">${a}</option>`).join('');
            }
        }

        async function handleSaveRecord(e) {
            e.preventDefault();
            const studentName = document.getElementById('recStudent').value;
            const catName = document.getElementById('recCategory').value;
            const actionName = document.getElementById('recAction').value;
            const noteVal = document.getElementById('recNote').value;
            
            const newRecord = {
                id: records.length + 1,
                action: "add",
                student_name: studentName,
                category: catName,
                action_name: actionName,
                date: new Date().toISOString().split('T')[0],
                note: noteVal
            };

            const btn = document.getElementById('saveBtn');
            btn.innerText = "Menghantar ke awan...";
            btn.disabled = true;

            if (APPS_SCRIPT_URL !== 'https://script.google.com/macros/s/AKfycbzuaBCeogmJKLasd4veucET3UFT69BxaPEYu702huNXPNk9bD-fQGejqDJd0jaBVcSz/exec') {
                try {
                    await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(newRecord)
                    });
                } catch (err) {
                    console.error("Error saving to cloud:", err);
                }
            }

            records.push(newRecord);
            localStorage.setItem('sts_records', JSON.stringify(records));

            alert(`🌟 Amalan positif telah direkodkan ke Google Sheets!\n\nTahniah! Amalan ${studentName} telah berjaya disimpan.`);
            changeTab('utama');
        }

        function renderPodiumMonthly() {
            try {
                const filteredRecords = selectedPodiumMonth === 'all' 
                    ? records 
                    : records.filter(r => r && r.date && String(r.date).includes(selectedPodiumMonth));

                return `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                            <h2 class="font-bold text-slate-700 text-sm">🏆 PODIUM PENGHARGAAN BULANAN</h2>
                            <select onchange="changePodiumMonth(this.value)" class="p-2 rounded-xl border border-slate-200 text-xs font-medium bg-slate-50 cursor-pointer">
                                <option value="all" ${selectedPodiumMonth === 'all' ? 'selected' : ''}>Semua Masa</option>
                                <option value="2026-09" ${selectedPodiumMonth === '2026-09' ? 'selected' : ''}>September 2026</option>
                                <option value="2026-10" ${selectedPodiumMonth === '2026-10' ? 'selected' : ''}>Oktober 2026</option>
                                <option value="2026-11" ${selectedPodiumMonth === '2026-11' ? 'selected' : ''}>November 2026</option>
                                <option value="2026-12" ${selectedPodiumMonth === '2026-12' ? 'selected' : ''}>Disember 2026</option>
                            </select>
                        </div>

                        ${categories.map(cat => {
                            const counts = {};
                            students.forEach(s => { counts[s.name] = 0; });
                            filteredRecords.filter(r => r && r.category === cat.name).forEach(r => {
                                if (counts[r.student_name] !== undefined) counts[r.student_name]++;
                            });

                            const sortedStudents = [...students].sort((a, b) => (counts[b.name] || 0) - (counts[a.name] || 0));

                            const p1 = sortedStudents[0];
                            const p2 = sortedStudents[1];
                            const p3 = sortedStudents[2];

                            const c1 = p1 ? (counts[p1.name] || 0) : 0;
                            const c2 = p2 ? (counts[p2.name] || 0) : 0;
                            const c3 = p3 ? (counts[p3.name] || 0) : 0;

                            return `
                                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                                    <h3 class="font-bold text-slate-800 flex items-center justify-between text-sm border-b pb-2">
                                        <span class="flex items-center gap-2"><span class="text-2xl">${cat.icon}</span> ANUGERAH${cat.name.toUpperCase()}</span>
                                        <span class="text-xs text-orange-600 bg-orange-50 px-2.5 py-1 rounded-full font-semibold">Berdasarkan Rekod</span>
                                    </h3>
                                    
                                    <div class="grid grid-cols-3 gap-3 items-end pt-2">
                                        <div class="bg-slate-50 border border-slate-200 p-3 rounded-2xl text-center flex flex-col items-center justify-between h-40 shadow-sm">
                                            <span class="bg-slate-200 text-slate-700 text-[10px] font-bold px-2 py-0.5 rounded-full">🥈 Placing 2</span>
                                            <div class="w-10 h-10 bg-slate-200 rounded-full flex items-center justify-center text-lg">🥈</div>
                                            <div>
                                                <p class="font-bold text-xs text-slate-800 line-clamp-1">${p2 ? p2.name : '-'}</p>
                                                <p class="text-[10px] text-orange-600 font-semibold mt-0.5">${c2} Rekod</p>
                                            </div>
                                        </div>

                                        <div class="bg-amber-50 border-2 border-amber-300 p-3 rounded-2xl text-center flex flex-col items-center justify-between h-48 shadow-md relative -top-2">
                                            <span class="bg-amber-400 text-white text-[10px] font-bold px-2.5 py-1 rounded-full shadow-sm">🥇 Placing 1</span>
                                            <div class="w-12 h-12 bg-amber-200 rounded-full flex items-center justify-center text-xl shadow-inner">👑</div>
                                            <div>
                                                <p class="font-bold text-xs text-amber-900 line-clamp-1">${p1 ? p1.name : '-'}</p>
                                                <p class="text-[10px] text-orange-600 font-semibold mt-0.5">${c1} Rekod</p>
                                            </div>
                                        </div>

                                        <div class="bg-amber-50/50 border border-amber-200/60 p-3 rounded-2xl text-center flex flex-col items-center justify-between h-36 shadow-sm">
                                            <span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-full">🥉 Placing 3</span>
                                            <div class="w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center text-lg">🥉</div>
                                            <div>
                                                <p class="font-bold text-xs text-slate-800 line-clamp-1">${p3 ? p3.name : '-'}</p>
                                                <p class="text-[10px] text-orange-600 font-semibold mt-0.5">${c3} Rekod</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            } catch (err) {
                return `<div class="p-4 text-center text-red-500 font-bold">Ralat: ${err.message}</div>`;
            }
        }

        function renderStudentList() {
            return `
                <div class="space-y-4">
                    <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div>
                            <h2 class="kid-font text-2xl font-bold text-orange-600">👧👦 PENGURUSAN MURID</h2>
                            <p class="text-xs text-slate-500 mt-0.5">Tambah atau urus profil cilik terpuji.</p>
                        </div>
                        <button onclick="openAddStudentModal()" class="px-5 py-2.5 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold text-xs rounded-xl shadow hover:opacity-90 transition cursor-pointer flex items-center gap-2">
                            <span>➕</span> Tambah Murid Baharu
                        </button>
                    </div>

                    <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                        <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                            <h3 class="font-bold text-slate-700 text-sm">Senarai Murid</h3>
                            <span class="text-xs bg-orange-50 text-orange-700 px-3 py-1 rounded-full font-semibold">${students.length} Murid</span>
                        </div>
                        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
                            ${students.map(s => `
                                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex items-center justify-between hover:bg-white hover:shadow transition">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 bg-gradient-to-tr from-amber-400 to-orange-400 text-white rounded-2xl flex items-center justify-center font-bold text-sm shadow-sm">
                                            ${s.name.charAt(0)}
                                        </div>
                                        <div>
                                            <h4 class="font-bold text-xs text-slate-800 line-clamp-1">${s.name}</h4>
                                            <p class="text-[10px] text-slate-500 mt-0.5">${s.class}</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-1">
                                        <button onclick="viewStudentProfile(${s.id})" class="p-2 bg-orange-100 text-orange-600 rounded-xl text-xs cursor-pointer hover:bg-orange-200 transition" title="Lihat Profil">🏅</button>
                                        <button onclick="deleteStudent(${s.id})" class="p-2 bg-rose-50 text-rose-500 rounded-xl text-xs cursor-pointer hover:bg-rose-100 transition" title="Padam">🗑️</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function viewStudentProfile(id) {
            selectedStudentProfile = id;
            renderView();
        }

        function renderStudentProfileView(id) {
            const student = students.find(s => s.id === id);
            const studentRecords = records.filter(r => r.student_name === student.name);

            return `
                <div class="space-y-6 max-w-2xl mx-auto">
                    <button onclick="selectedStudentProfile = null; renderView();" class="text-xs bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-bold hover:bg-slate-300 transition cursor-pointer flex items-center gap-1">
                        <span>⬅️</span> Kembali ke Senarai Murid
                    </button>

                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 text-center space-y-3">
                        <div class="w-20 h-20 bg-gradient-to-tr from-amber-400 to-orange-400 text-white rounded-full mx-auto flex items-center justify-center text-3xl font-bold shadow-md">
                            ${student.name.charAt(0)}
                        </div>
                        <div>
                            <h2 class="kid-font text-2xl font-bold text-slate-800">${student.name}</h2>
                            <p class="text-xs text-orange-600 font-semibold mt-0.5">${student.class}</p>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                            <span>📖</span> Sejarah Amalan Positif (${studentRecords.length})
                        </h3>
                        ${studentRecords.length === 0 ? `
                            <p class="text-xs text-slate-400 text-center py-4 italic">Belum ada rekod amalan positif dicatatkan untuk murid ini.</p>
                        ` : `
                            <div class="space-y-2">
                                ${studentRecords.map(r => `
                                    <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100 text-xs space-y-1">
                                        <div class="flex justify-between items-center text-[10px] text-slate-500 font-semibold">
                                            <span class="bg-orange-100 text-orange-700 px-2 py-0.5 rounded-md">${r.category}</span>
                                            <span>${r.date}</span>
                                        </div>
                                        <p class="font-bold text-slate-800">${r.action || r.action_name}</p>
                                        ${r.note ? `<p class="text-[11px] text-slate-600 italic">Catatan: ${r.note}</p>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function openAddStudentModal() {
            document.getElementById('addStudentModal').classList.remove('hidden');
        }

        function closeAddStudentModal() {
            document.getElementById('addStudentModal').classList.add('hidden');
        }

        function handleAddNewStudent(e) {
            e.preventDefault();
            const nameInput = document.getElementById('newStudentName').value.trim();
            const classInput = document.getElementById('newStudentClass').value;
            
            if (!nameInput) return;

            const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;
            students.push({ id: newId, name: nameInput, class: classInput });
            localStorage.setItem('sts_students', JSON.stringify(students));

            closeAddStudentModal();
            document.getElementById('newStudentName').value = '';
            renderView();
            alert(`🌟 Berjaya!\n\n${nameInput} telah berjaya ditambahkan ke dalam senarai.`);
        }

        function deleteStudent(id) {
            const passwordInput = prompt("Sila masukkan kata laluan untuk memadam rekod murid (Password: sts):");
            if (passwordInput === null) return;
            if (passwordInput === "sts") {
                students = students.filter(s => s.id !== id);
                localStorage.setItem('sts_students', JSON.stringify(students));
                renderView();
                alert("✅ Rekod murid telah berjaya dipadam.");
            } else {
                alert("❌ Kata laluan salah!");
            }
        }

        function renderReport() {
            const studentCounts = {};
            students.forEach(s => { studentCounts[s.name] = 0; });
            records.forEach(r => {
                if (studentCounts[r.student_name] !== undefined) {
                    studentCounts[r.student_name]++;
                } else {
                    studentCounts[r.student_name] = 1;
                }
            });

            return `
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-6 max-w-2xl mx-auto">
                    <div>
                        <h2 class="font-bold text-slate-800 text-base">📊 Laporan Amalan Cilik Terpuji</h2>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-center">
                            <p class="text-xs text-slate-500">Jumlah Rekod Keseluruhan</p>
                            <p class="text-2xl font-bold text-orange-600 mt-1">${records.length}</p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-center">
                            <p class="text-xs text-slate-500">Jumlah Murid</p>
                            <p class="text-2xl font-bold text-emerald-600 mt-1">${students.length}</p>
                        </div>
                    </div>

                    <div class="space-y-3 pt-2 border-t border-slate-100">
                        <h3 class="font-bold text-slate-700 text-sm">📋 Jumlah Amalan Baik Mengikut Nama Murid</h3>
                        <div class="max-h-64 overflow-y-auto space-y-2 pr-1">
                            ${students.map(s => {
                                const total = studentCounts[s.name] || 0;
                                return `
                                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center text-xs">
                                        <span class="font-medium text-slate-800">${s.name}</span>
                                        <span class="bg-orange-100 text-orange-700 font-bold px-3 py-1 rounded-full">${total} Rekod</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="space-y-2 pt-2 border-t border-slate-100">
                        <p class="text-xs font-semibold text-slate-600">Muat Turun Laporan:</p>
                        <div class="flex gap-2">
                            <button onclick="downloadPDFReport()" class="flex-1 py-3 bg-orange-500 text-white text-xs font-bold rounded-xl shadow cursor-pointer hover:bg-orange-600 transition">📥 Cetak / PDF</button>
                            <button onclick="downloadExcelReport()" class="flex-1 py-3 bg-emerald-600 text-white text-xs font-bold rounded-xl shadow cursor-pointer hover:bg-emerald-700 transition">📥 Excel (CSV)</button>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-rose-100">
                        <p class="text-xs font-semibold text-rose-600 mb-2">Zon Bahaya (Tetapan Semula):</p>
                        <button onclick="resetAmalanData()" class="w-full py-3 bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold rounded-xl shadow-sm cursor-pointer hover:bg-rose-100 transition">
                            🔄 Reset / Clear Data Amalan Baik
                        </button>
                    </div>
                </div>
            `;
        }

        function downloadPDFReport() {
            window.print();
        }

        function downloadExcelReport() {
            let csvContent = "data:text/csv;charset=utf-8,ID,Nama Murid,Kategori,Amalan,Tarikh,Catatan\n";
            records.forEach(r => {
                csvContent += `"${r.id}","${r.student_name}","${r.category}","${r.action || r.action_name}","${r.date}","${r.note || ''}"\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Laporan_Amalan_Cilik_Terpuji.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function resetAmalanData() {
            const passwordInput = prompt("Sila masukkan kata laluan untuk MENGOSONGKAN semua data awan (Password: sts):");
            if (passwordInput === null) return;
            if (passwordInput === "sts") {
                if (APPS_SCRIPT_URL !== 'https://script.google.com/macros/s/AKfycbzuaBCeogmJKLasd4veucET3UFT69BxaPEYu702huNXPNk9bD-fQGejqDJd0jaBVcSz/exec') {
                    try {
                        await fetch(APPS_SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: "reset" })
                        });
                    } catch (err) {
                        console.error("Error resetting cloud:", err);
                    }
                }
                records = [];
                localStorage.removeItem('sts_records');
                renderView();
                alert("🧹 Semua data amalan positif telah berjaya dikosongkan dari awan.");
            } else {
                alert("❌ Kata laluan salah!");
            }
        }

        // Fetch initial data
        fetchCloudData();
    </script>
</body>
</html>
